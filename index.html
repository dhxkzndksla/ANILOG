<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIME WORLD</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #120f1d;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1d1730;
  border-bottom: 1px solid #49345e;
}
.logo { color: #edb4f7; font-size: 25px; font-weight: bold; }
nav a {
  color: white; text-decoration: none;
  margin-left: 20px; font-size: 14px;
}
.hero {
  padding: 85px 8%;
  background: linear-gradient(120deg,#49275f,#20152f,#151326);
  text-align: center;
}
.hero h1 { font-size: 42px; margin: 10px; }
.hero p { color: #d6c4e4; }
.search {
  margin-top: 25px;
  width: min(500px,100%);
  padding: 15px;
  border: 0; border-radius: 12px;
  font-size: 16px;
}
main { padding: 35px 7%; }
.filters {
  display: flex; gap: 10px;
  flex-wrap: wrap; margin-bottom: 25px;
}
.filters button {
  background: #30223f; color: white;
  border: 1px solid #604477;
  border-radius: 20px; padding: 10px 18px;
  cursor: pointer;
}
.filters button.active { background: #a45bc1; }
.anime-list {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
  gap: 22px;
}
.card {
  background: #211a30;
  border-radius: 13px; overflow: hidden;
  cursor: pointer; transition: .2s;
}
.card:hover { transform: translateY(-5px); }
.card img {
  width: 100%; height: 245px;
  object-fit: cover; display: block;
  background: #30223f;
}
.info { padding: 13px; }
.info h3 { margin: 0 0 8px; }
.info p { color: #c4b2d3; font-size: 13px; }
.fav {
  background: none; border: 0;
  color: #ff9dcb; font-size: 20px;
  cursor: pointer; float: right;
}
.modal {
  display: none; position: fixed;
  inset: 0; background: #000c;
  justify-content: center; align-items: center;
  padding: 20px; z-index: 10;
}
.modal-box {
  background: #251c36; border-radius: 16px;
  padding: 25px; max-width: 450px; width: 100%;
  max-height: 85vh; overflow-y: auto;
}
.modal-box img {
  width: 130px; border-radius: 10px;
  float: left; margin-right: 18px;
}
.close {
  float: right; cursor: pointer;
  background: none; color: white;
  border: none; font-size: 24px;
}
footer {
  text-align: center; padding: 30px;
  color: #9885a8; background: #1d1730;
}
@media(max-width:600px) {
  nav a { margin-left: 8px; font-size: 12px; }
  .hero h1 { font-size: 30px; }
  .card img { height: 210px; }
}

.admin-area { padding: 0 7% 28px; }
.admin-toggle {
  background: #a45bc1; color: white; border: 0; border-radius: 9px;
  padding: 11px 16px; cursor: pointer; font-size: 14px;
}
.admin-panel {
  display: none; margin-top: 14px; padding: 20px;
  background: #211a30; border: 1px solid #604477; border-radius: 13px;
}
.admin-panel h3 { margin: 0 0 16px; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 14px; }
.admin-panel label { display: block; color: #d6c4e4; font-size: 13px; margin: 4px 0 6px; }
.admin-panel input, .admin-panel select {
  width: 100%; padding: 11px; border: 1px solid #604477; border-radius: 8px;
  background: #120f1d; color: white; margin-bottom: 12px;
}
.admin-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.admin-actions button {
  border: 0; border-radius: 8px; padding: 11px 15px; cursor: pointer;
  background: #a45bc1; color: white;
}
.admin-actions button.secondary { background: #49345e; }
#posterPreview {
  display: none; width: 105px; height: 145px; object-fit: cover;
  border-radius: 8px; margin: 4px 0 12px; background: #30223f;
}
.admin-note { color: #bba9ca; font-size: 12px; line-height: 1.55; }

</style>
</head>
<body>

<header>
  <div class="logo">✦ ANIME WORLD</div>
  <nav>
    <a href="#">홈</a>
    <a href="#anime">애니목록</a>

  </nav>
</header>

<section class="hero">
  <h1>당신의 다음 인생 애니를 찾아보세요 ✨</h1>
  <p>다양한 애니메이션의 정보와 이야기를 만나보세요.</p>
  <input id="search" class="search"
    placeholder="🔍 애니메이션 제목 검색..."
    oninput="render()">
</section>

<main id="anime">
  <h2>🌸 ANIME COLLECTION</h2>
  <div class="filters" id="filters"></div>
  <div class="anime-list" id="list"></div>
  <p id="empty" style="display:none">검색 결과가 없습니다.</p>
</main>


<section class="admin-area">
  <button class="admin-toggle" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="admin-panel" id="adminPanel" style="display:none">
    <h3>ANIME WORLD 작품 관리</h3>
    <p class="admin-note">작품을 추가하거나 기존 정보를 수정·삭제할 수 있어.</p>
    <label for="adminAnime">관리할 작품</label>
    <select id="adminAnime" onchange="loadAnimeEdit()"></select>
    <div class="admin-grid">
      <div>
        <label for="adminTitle">작품 제목</label>
        <input id="adminTitle" type="text" placeholder="애니 제목">
        <label for="adminGenre">장르</label>
        <input id="adminGenre" type="text" placeholder="예: 액션">
        <label for="adminYear">방영/개봉 연도</label>
        <input id="adminYear" type="text" placeholder="예: 2024">
        <label for="adminRating">평점</label>
        <input id="adminRating" type="text" placeholder="예: 8.7 또는 —">
      </div>
      <div>
        <label for="adminImage">포스터 이미지 주소(URL)</label>
        <input id="adminImage" type="url" placeholder="https://...">
        <img id="posterPreview" alt="포스터 미리보기">
        <p class="admin-note">이미지 파일 자체의 주소를 넣어 줘.</p>
      </div>
    </div>
    <label for="adminDesc">작품 소개</label>
    <textarea id="adminDesc" rows="4" placeholder="작품 소개를 입력해 줘." style="width:100%;padding:11px;border:1px solid #604477;border-radius:8px;background:#120f1d;color:white;margin:5px 0 14px;font:inherit"></textarea>
    <div class="admin-actions">
      <button onclick="newAnimeEntry()">＋ 새 작품 추가</button>
      <button onclick="saveAnimeEntry()">저장하기</button>
      <button class="secondary" onclick="exportUpdatedHTML()">HTML로 저장</button>
      <button class="secondary" onclick="deleteAnimeEntry()">선택 작품 삭제</button>
      <button class="secondary" onclick="resetAnimeCatalogue()">전체 목록 초기화</button>
    </div>
    <p class="admin-note">변경 내용은 이 브라우저에 저장돼. 다른 기기에는 자동으로 공유되지 않아.</p>
  </div>
</section>
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="close" onclick="hideModal()">×</button>
    <div id="details"></div>
  </div>
</div>

<footer>
  ✦ ANIME WORLD © 2026<br>
  애니메이션 정보 팬 프로젝트
</footer>

// 로컬 관리자 잠금: 이 파일을 직접 열어 코드를 보면 비밀번호 확인 로직을 확인할 수 있어.
const ADMIN_PASSWORD = "오타쿠아님1010";
const originalAnimeData = JSON.parse(JSON.stringify(anime));
const savedCatalogue = JSON.parse(localStorage.getItem("animeWorldCatalogue") || "null");
if (Array.isArray(savedCatalogue)) {
  anime.splice(0, anime.length, ...savedCatalogue);
}
function exportUpdatedHTML() {
  const html = "<!DOCTYPE html>\n" +
    document.documentElement.outerHTML;

  const newAnime = JSON.stringify(anime, null, 2);

  const pattern =
    /const anime = \[[\s\S]*?\];(?=\s*const originalAnimeData)/;

  if (!pattern.test(html)) {
    alert("작품 목록을 찾지 못했어. 파일을 확인해 줘.");
    return;
  }

  let updatedHTML = html.replace(
    pattern,
    "const anime = " + newAnime + ";"
  );

  updatedHTML = updatedHTML.replace(
    /const savedCatalogue = JSON\.parse\(localStorage\.getItem\("animeWorldCatalogue"\) \|\| "null"\);/,
    "const savedCatalogue = null;"
  );

  const blob = new Blob(
    [updatedHTML],
    { type: "text/html;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "ANILOG_updated.html";
  link.click();

  URL.revokeObjectURL(url);

  alert("최신 HTML 파일을 저장했어!");
}
let adminUnlocked = false;
let editingNewAnime = false;


function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  if (adminUnlocked && panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }
  if (!adminUnlocked) {
    const entered = prompt("관리자 비밀번호를 입력해 줘.");
    if (entered === null) return;
    if (entered !== ADMIN_PASSWORD) {
      alert("비밀번호가 맞지 않아.");
      return;
    }
    adminUnlocked = true;
  }
  panel.style.display = "block";
  populateAdminSelect();
  if (!editingNewAnime) loadAnimeEdit();
}

function populateAdminSelect(selectedTitle) {
  const select = document.getElementById("adminAnime");
  const previous = selectedTitle || select.value;
  select.innerHTML = anime.map((item, index) =>
    `<option value="${index}">${item.title.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</option>`
  ).join("");
  if (anime.length) {
    const found = anime.findIndex(item => item.title === previous);
    select.value = String(found >= 0 ? found : 0);
  }
}

function loadAnimeEdit() {
  const index = Number(document.getElementById("adminAnime").value);
  const item = anime[index];
  if (!item) return;
  editingNewAnime = false;
  document.getElementById("adminTitle").value = item.title || "";
  document.getElementById("adminGenre").value = item.genre || "";
  document.getElementById("adminYear").value = item.year ?? "";
  document.getElementById("adminRating").value = item.rating ?? "";
  document.getElementById("adminImage").value = item.image || "";
  document.getElementById("adminDesc").value = item.desc || "";
  updatePosterPreview();
}

function updatePosterPreview() {
  const image = document.getElementById("posterPreview");
  const url = document.getElementById("adminImage").value.trim();
  image.src = url;
  image.style.display = url ? "block" : "none";
  image.onerror = () => { image.style.display = "none"; };
}

function newAnimeEntry() {
  editingNewAnime = true;
  document.getElementById("adminAnime").value = "";
  document.getElementById("adminTitle").value = "";
  document.getElementById("adminGenre").value = "";
  document.getElementById("adminYear").value = "";
  document.getElementById("adminRating").value = "";
  document.getElementById("adminImage").value = "";
  document.getElementById("adminDesc").value = "";
  updatePosterPreview();
  document.getElementById("adminTitle").focus();
}

function saveAnimeEntry() {
  const title = document.getElementById("adminTitle").value.trim();
  if (!title) {
    alert("작품 제목을 입력해 줘.");
    return;
  }
  const entry = {
    title,
    genre: document.getElementById("adminGenre").value.trim() || "기타",
    year: document.getElementById("adminYear").value.trim() || "정보 없음",
    rating: document.getElementById("adminRating").value.trim() || "—",
    image: document.getElementById("adminImage").value.trim() || "https://placehold.co/300x420/372044/ffffff?text=Anime",
    desc: document.getElementById("adminDesc").value.trim() || "작품 소개가 아직 등록되지 않았어."
  };
  if (editingNewAnime) {
    if (anime.some(item => item.title.toLowerCase() === title.toLowerCase())) {
      alert("같은 제목의 작품이 이미 있어.");
      return;
    }
    anime.push(entry);
  } else {
    const index = Number(document.getElementById("adminAnime").value);
    if (!anime[index]) return;
    const oldTitle = anime[index].title;
    anime[index] = entry;
    favorites = favorites.map(name => name === oldTitle ? title : name);
    localStorage.setItem("favorites", JSON.stringify(favorites));
  }
  localStorage.setItem("animeWorldCatalogue", JSON.stringify(anime));
  category = "전체";
  makeFilters();
  render();
  populateAdminSelect(title);
  editingNewAnime = false;
  loadAnimeEdit();
  alert("저장했어!");
}

function deleteAnimeEntry() {
  if (editingNewAnime) {
    alert("삭제할 작품을 먼저 선택해 줘.");
    return;
  }
  const index = Number(document.getElementById("adminAnime").value);
  if (!anime[index]) return;
  const title = anime[index].title;
  if (!confirm(`'${title}' 작품을 목록에서 삭제할까?`)) return;
  anime.splice(index, 1);
  favorites = favorites.filter(name => name !== title);
  localStorage.setItem("favorites", JSON.stringify(favorites));
  localStorage.setItem("animeWorldCatalogue", JSON.stringify(anime));
  populateAdminSelect();
  if (anime.length) loadAnimeEdit();
  else newAnimeEntry();
  makeFilters();
  render();
}

function resetAnimeCatalogue() {
  if (!confirm("목록 전체를 처음 제공된 기본 작품들로 되돌릴까? 추가·수정·삭제한 내용이 모두 사라져.")) return;
  anime.splice(0, anime.length, ...JSON.parse(JSON.stringify(originalAnimeData)));
  localStorage.removeItem("animeWorldCatalogue");
  populateAdminSelect();
  if (anime.length) loadAnimeEdit();
  makeFilters();
  render();
  alert("기본 목록으로 초기화했어.");
}

let category = "전체";
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

const genres = ["전체","액션","로맨스","코미디","스포츠","판타지","즐겨찾기"];

function makeFilters() {
  document.getElementById("filters").innerHTML =
    genres.map(g => `<button class="${g===category?'active':''}"
    onclick="setCategory('${g}')">${g}</button>`).join("");
}

function setCategory(g) {
  category = g;
  makeFilters();
  render();
}

function toggleFav(title,event) {
  event.stopPropagation();
  favorites = favorites.includes(title)
    ? favorites.filter(x => x !== title)
    : [...favorites,title];
  localStorage.setItem("favorites",JSON.stringify(favorites));
  render();
}
